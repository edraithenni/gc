apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-postgres-data
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gc-postgres
  template:
    metadata:
      labels:
        app: gc-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: mlflow
            - name: POSTGRES_USER
              value: mlflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U mlflow -d mlflow
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: mlflow-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: gc-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gc-mlflow
  template:
    metadata:
      labels:
        app: gc-mlflow
    spec:
      containers:
        - name: mlflow
          image: gc-mlflow:3.6.0
          imagePullPolicy: Never

          command:
            - /bin/sh
            - -c
          args:
            - |
              exec mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --workers 2 \
                --backend-store-uri "postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow" \
                --artifacts-destination s3://mlflow-artifacts \
                --allowed-hosts "mlflow,mlflow:5000,mlflow.default.svc.cluster.local,mlflow.default.svc.cluster.local:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://silo.silo.svc.cluster.local:9000
            - name: AWS_DEFAULT_REGION
              value: us-east-1

          envFrom:
            - secretRef:
                name: gc-s3-mlflow

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app: gc-mlflow
  ports:
    - port: 5000
      targetPort: 5000
